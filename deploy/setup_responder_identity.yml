---
# Responder agent identity — deploys the dedicated agent user, SSH key
# with from= restriction, per-class enumerated sudoers, and the audit
# journal namespace.
#
# Deploys the dedicated responder identity to the fleet: system user, SSH key
# with from= restriction, per-class enumerated sudoers, journald namespace for
# the audit trail. Run with: make setupresponder
#
# HARD FAILS: any generated sudoers containing a
# restart wildcard or a hypervisor-critical unit name aborts the play before
# anything is written.
#
# Requires: responder_public_key (from your secret store or -e), plus the

- name: Responder agent identity
  hosts: all
  become: true
  vars_files:
    - responder-vars.yml
  vars:
    responder_excluded: "{{ responder_excluded_hosts | default([]) }}"
    responder_domain: "{{ responder_dns_domain | mandatory }}"
  pre_tasks:
    - name: Assert responder public key is provided
      ansible.builtin.assert:
        that:
          - responder_public_key is defined
          - responder_public_key | length > 40
        fail_msg: >-
          responder_public_key (ed25519 pubkey) must come from your secret store or -e.
          Generate with: ssh-keygen -t ed25519 -f responder_ed25519 -C responder

    - name: Assert no forbidden unit appears in any restartable list
      ansible.builtin.assert:
        that:
          - responder_restartable_units.values() | flatten | length == 0 or
            not (responder_restartable_units.values() | flatten | join(' ')
                 is search(responder_forbidden_units | map('regex_replace', '([.])', '\\\1') | join('|')))
        fail_msg: A forbidden unit (pve-cluster, tailscaled, ssh…) appeared in a restart list
      run_once: true
      delegate_to: localhost

    - name: Assert no wildcard restart entries in vars
      ansible.builtin.assert:
        that:
          - >
            (responder_restartable_units.values() | flatten |
             select('search', '\\*') | list) == []
        fail_msg: Wildcard found in responder_restartable_units — enumerate units exactly
      run_once: true
      delegate_to: localhost

  tasks:
    - name: Skip excluded hosts entirely (no key, no user, no sudoers)
      ansible.builtin.meta: end_host
      when: inventory_hostname in responder_excluded

    - name: sudo present (Proxmox nodes ship without it)
      ansible.builtin.apt:
        name: sudo
        state: present
      when: ansible_facts['os_family'] == 'Debian'

    - name: Responder group
      ansible.builtin.group:
        name: "{{ responder_group }}"
        system: true

    - name: Responder user
      ansible.builtin.user:
        name: "{{ responder_user }}"
        group: "{{ responder_group }}"
        shell: /bin/bash
        home: /var/lib/responder
        create_home: true
        system: true

    - name: Responder ssh dir
      ansible.builtin.file:
        path: /var/lib/responder/.ssh
        state: directory
        owner: "{{ responder_user }}"
        group: "{{ responder_group }}"
        mode: "0700"

    - name: Responder authorized key (from= responder host only)
      ansible.posix.authorized_key:
        user: "{{ responder_user }}"
        key: "from=\"{{ responder_allowed_source_ranges | join(',') }}\" {{ responder_public_key }}"
        key_options: 'no-port-forwarding,no-X11-forwarding,no-agent-forwarding'
      # NOTE: command= deliberately absent — commands vary per incident; the
      # The sudo whitelist + wrapper are the boundary.

    - name: Common sudoers (read-only baseline)
      ansible.builtin.template:
        src: sudoers-common.j2
        dest: /etc/sudoers.d/responder-common
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s

    - name: App-host restart sudoers (enumerated units only)
      ansible.builtin.template:
        src: sudoers-app-restart.j2
        dest: /etc/sudoers.d/responder-restart
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s
      vars:
        responder_units: "{{ responder_restartable_units[inventory_hostname ~ '.' ~ responder_domain] | default([]) }}"
        apt_hold_packages: []
      when: inventory_hostname ~ '.' ~ responder_domain in responder_restartable_units

    - name: Remove stale app sudoers on hosts without restart grants
      ansible.builtin.file:
        path: /etc/sudoers.d/responder-restart
        state: absent
      when: inventory_hostname ~ '.' ~ responder_domain not in responder_restartable_units

    - name: Hypervisor sudoers (qm/pct status + reset only)
      ansible.builtin.template:
        src: sudoers-hypervisor.j2
        dest: /etc/sudoers.d/responder-hypervisor
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s
      when: inventory_hostname in responder_key_hosts.hypervisors or inventory_hostname.split(".")[0] in (responder_key_hosts.hypervisors | map("regex_replace", "\\." ~ responder_domain ~ "$", "") | list)

    - name: journald namespace for responder audit trail
      ansible.builtin.copy:
        dest: /etc/systemd/journald.conf.d/responder.conf
        content: |
          # Responder agent audit namespace — every sudo action the responder
          # takes lands in the responder@ namespace (journalctl -M responder).
          LogNamespace=responder
        mode: "0644"
      notify: Restart journald
      when: ansible_facts['os_family'] != 'Darwin'

    - name: Weekly hold-expiry script (persistent mutations expire)
      tags: [responder_holds]
      ansible.builtin.copy:
        src: ../holds_expire.sh
        dest: /usr/local/sbin/responder-holds-expire
        mode: "0755"
      when: ansible_facts['os_family'] != 'Darwin'

    - name: Weekly hold-expiry systemd units
      tags: [responder_holds]
      ansible.builtin.template:
        src: holds-expire.{{ item }}.j2
        dest: "/etc/systemd/system/responder-holds-expire.{{ item }}"
        mode: "0644"
      loop: [service, timer]
      when: ansible_facts['os_family'] != 'Darwin'
      notify: Enable responder holds-expire timer

    - name: macOS hosts get the key and nothing else
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} is macOS/readonly: key deployed above, no
          sudoers, no journald namespace. Read-only runbooks only (v1 scope).
      when: inventory_hostname in responder_readonly_only_hosts | default([])

  handlers:
    - name: Restart journald
      ansible.builtin.systemd:
        name: systemd-journald
        state: restarted

    - name: Enable responder holds-expire timer
      tags: [responder_holds]
      ansible.builtin.systemd:
        name: responder-holds-expire.timer
        enabled: true
        state: started
        daemon_reload: true

    # ---- Responder LXC state-dir prep (added after drill 1, 2026-11-23) ----
    # The pi session runs as `responder` (the classifier drops privileges via
    # runuser); the state tree must be writable by that user. Drill 1 found
    # all of these missing on the first real spawn.
    - name: Responder state tree is responder-writable (drill-1 fix)
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: responder
        group: responder
        mode: "{{ item.mode }}"
      loop:
        - { path: /var/lib/responder/incidents, mode: "0755" }
        - { path: /var/lib/responder/locks, mode: "0755" }
        - { path: /var/lib/responder/.pi, mode: "0700" }
        - { path: /var/lib/responder/.pi/agent, mode: "0700" }
      when: responder_is_lxc_host | default(false)
      delegate_to: "{{ responder_lxc_host | default('responder-host') }}"
      run_once: true
